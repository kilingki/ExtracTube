[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extractube"
version = "0.1.0"
description = "ExtracTube stage 1 audio pipeline"
requires-python = ">=3.12"
dependencies = ["yt-dlp"]

[project.scripts]
extractube = "extractube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
